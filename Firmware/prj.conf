# Sensors
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_MAX30101=y
# MAX30101 sensor settings (mode, LEDs, rate) are in the devicetree overlay.
# src/step_counter.c drives the BMI270 directly; see the comment there for why
# Zephyr's driver cannot be used on the nRF52832.
CONFIG_BMI270=n

# Status LED: WS2812 through Zephyr's SPI driver (see the overlay).
CONFIG_LED_STRIP=y

# BLE link to the app: one connection, no pairing. The name must start with
# "umbra" (any case) for the app to find the band.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Umbra"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_HRS=y
CONFIG_BT_BAS=y
# Firmware version: the one place it is set. Shown over RTT at start-up and in
# the Device Information Service (Firmware Revision String, 0x2A26). Raise it
# for every build that leaves the bench.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="1.2.0"
# What a phone's Bluetooth settings or a BLE scanner shows for the band, instead
# of Zephyr's placeholders ("Manufacturer", the SoC name).
CONFIG_BT_DIS_MANUF_NAME_STR="Umbra"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Umbra Band"
# No PnP ID: the default reports vendor ID 0, which is not a real vendor.
CONFIG_BT_DIS_PNP=n
# For the current app's JSON link; remove once it uses the services above.
CONFIG_BT_NUS=y
# Ask the phone for a 200-400 ms connection interval (1.25 ms units), and a 4 s
# timeout (10 ms units), since data goes at most once a second. It may refuse.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=160
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=320
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# Up to a 247-byte MTU and 251-byte packets, so a log transfer sends 12 records
# per notification instead of one (an iPhone negotiates 185 or more).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Battery voltage on P0.28, and system off on a flat battery.
CONFIG_ADC=y
CONFIG_POWEROFF=y

# Flash storage for values the app sets (src/storage.c): Zephyr settings on
# NVS, in the settings_storage partition the Partition Manager adds.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
# 48 KB (twelve 4 KB sectors) instead of 8 KB: the data log (src/data_log.c)
# keeps 1024 records of 20 bytes (28 with NVS's header, ~29 KB) in the same
# NVS, and NVS needs free sectors to reclaim space. The app area shrinks to
# match (~460 KB left).
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0xC000
CONFIG_SETTINGS_NVS_SECTOR_COUNT=12
# Index of the newest entry per ID, so reading a log record does not walk the
# whole partition (4 bytes of RAM each).
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=1024

# Hardware watchdog (src/watchdog.c) and the reset reason printed at start-up.
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y

# The Bluetooth host runs on the system work queue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging over Segger RTT
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
# 4 KB instead of 1 KB: the boot output (Bluetooth start-up, firmware version,
# reset reason, mode) overflowed 1 KB before the viewer read it, and was lost.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# No ANSI colours: a dropped log line left fragments like "0m [0m" in the output.
CONFIG_LOG_BACKEND_SHOW_COLOR=n
# The board's UART is not wired up here and output goes over RTT.
CONFIG_SERIAL=n

# The BMD-350 module has no 32.768 kHz crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Hardware floating point for the heart-rate autocorrelation (~25k MACs/s).
CONFIG_FPU=y
# Preserve the estimator's float registers across the radio's and other threads' work.
CONFIG_FPU_SHARING=y

CONFIG_MAIN_STACK_SIZE=4096
